name: Auto-generate new episode pages

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install requests

      - name: Run episode generator
        run: python3 scripts/generate_episodes.py

      - name: Check for new files
        id: changes
        run: |
          git add -A
          if git diff --cached --quiet; then
            echo "new_episodes=false" >> $GITHUB_OUTPUT
          else
            echo "new_episodes=true" >> $GITHUB_OUTPUT
          fi

      - name: Commit and push new episode pages
        if: steps.changes.outputs.new_episodes == 'true'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit -m "auto: add new episode page(s) from RSS feed [skip ci]"
          git push
